name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        # Major tags like @v10 are not published; pin a full release (Node 24)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies (incl. dev)
        run: uv sync --all-groups --frozen

      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy --strict src tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docuspace
          POSTGRES_PASSWORD: docuspace
          POSTGRES_DB: docuspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U docuspace -d docuspace"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://docuspace:docuspace@localhost:5432/docuspace
      STORAGE_BACKEND: memory
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies (incl. dev)
        run: uv sync --all-groups --frozen

      - name: Apply Alembic migrations
        run: uv run alembic upgrade head

      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: docuspace-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
