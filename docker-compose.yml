services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docuspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docuspace}
      POSTGRES_DB: ${POSTGRES_DB:-docuspace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-docuspace} -d $${POSTGRES_DB:-docuspace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack-pro:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SERVICES: s3,sqs,lambda
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
      DEBUG: 0
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docuspace}:${POSTGRES_PASSWORD:-docuspace}@db:5432/${POSTGRES_DB:-docuspace}
      S3_ENDPOINT_URL: http://localstack:4566
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:
